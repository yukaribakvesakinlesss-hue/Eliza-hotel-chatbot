<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Eliza Istanbul | Resmi Web Sitesi</title>
  <meta name="description" content="Hotel Eliza Istanbul - Tarihi Yarımada'da, Beyazıt ve Çemberlitaş tramvay duraklarına 3 dakika, Kapalıçarşı ve Sultanahmet'e yürüme mesafesinde konforlu konaklama.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ======================================================== */
    /* DESIGN TOKENS & SYSTEM VARIABLES (GÖRSEL KİMLİK)        */
    /* ======================================================== */
    :root {
      --color-bg: #FAF8F4;
      --color-surface: #FFFFFF;
      --color-surface-subtle: #F4EFEA;
      --color-text: #242420;
      --color-text-muted: #646059;
      --color-text-light: #8C877D;
      --color-gold: #A8864B;
      --color-gold-hover: #8F7038;
      --color-gold-light: #F7F3EB;
      --color-border: #E8E2D8;
      --color-border-subtle: #F0EAE1;
      --color-dark: #1E1E1A;
      --color-whatsapp: #25D366;
      --color-whatsapp-hover: #1EBE5D;
      --color-booking: #003580;
      --color-booking-hover: #00224F;
      --color-error: #B91C1C;
      --color-error-bg: #FEF2F2;

      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-pill: 50px;

      --shadow-sm: 0 2px 8px rgba(36, 36, 32, 0.04);
      --shadow-md: 0 8px 24px rgba(36, 36, 32, 0.06);
      --shadow-lg: 0 16px 40px rgba(36, 36, 32, 0.10);
      --transition-base: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    section[id] {
      scroll-margin-top: 90px;
    }

    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
    }
    .icon svg {
      width: 1em;
      height: 1em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ======================================================== */
    /* TOP UTILITY BAR                                          */
    /* ======================================================== */
    .top-bar {
      background: var(--color-dark);
      color: rgba(255, 255, 255, 0.82);
      font-size: 0.8rem;
      padding: 0.5rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .top-bar-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .top-bar-left, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 1.4rem;
    }
    .top-bar-item {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }
    .top-bar a {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      transition: color var(--transition-base);
    }
    .top-bar a:hover {
      color: var(--color-gold);
    }

    /* ======================================================== */
    /* HEADER & NAVIGATION (ÜST MENÜ DÜZENİ)                     */
    /* ======================================================== */
    header {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
    }
    .nav-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
    }
    .logo {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: var(--color-dark);
    }
    .logo-main {
      font-family: var(--font-serif);
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--color-dark);
      line-height: 1.1;
    }
    .logo-sub {
      font-size: 0.65rem;
      letter-spacing: 3.5px;
      color: var(--color-gold);
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 2px;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 1.6rem;
      list-style: none;
    }
    .nav-link {
      text-decoration: none;
      color: var(--color-text);
      font-weight: 500;
      font-size: 0.9rem;
      transition: color var(--transition-base);
      padding: 0.4rem 0;
      position: relative;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--color-gold);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    /* Language Switcher */
    .lang-switcher {
      display: inline-flex;
      align-items: center;
      background: var(--color-surface-subtle);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-pill);
      padding: 2px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--color-text-muted);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-pill);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all var(--transition-base);
    }
    .lang-btn.active {
      background: var(--color-surface);
      color: var(--color-dark);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      font-weight: 700;
    }

    /* Header Primary Action Button */
    .btn-header-primary {
      background: var(--color-dark);
      color: #fff !important;
      padding: 0.6rem 1.15rem;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all var(--transition-base);
    }
    .btn-header-primary:hover {
      background: var(--color-gold);
    }

    /* Secondary Nav Links */
    .header-secondary-icons {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .icon-link-secondary {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      text-decoration: none;
      transition: all var(--transition-base);
    }
    .icon-link-secondary:hover {
      border-color: var(--color-gold);
      color: var(--color-gold);
      background: var(--color-gold-light);
    }

    /* Mobile Hamburger Button */
    .btn-hamburger {
      display: none;
      background: transparent;
      border: 1px solid var(--color-border);
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--color-dark);
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    /* Mobile Drawer */
    .mobile-drawer {
      position: fixed;
      inset: 0;
      background: rgba(30, 30, 26, 0.6);
      backdrop-filter: blur(4px);
      z-index: 10001;
      display: none;
      opacity: 0;
      transition: opacity var(--transition-base);
    }
    .mobile-drawer.open {
      display: flex;
      opacity: 1;
    }
    .mobile-drawer-content {
      background: var(--color-surface);
      width: 300px;
      max-width: 85%;
      height: 100%;
      margin-left: auto;
      padding: 1.8rem 1.5rem;
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 24px rgba(0,0,0,0.15);
      transform: translateX(100%);
      transition: transform var(--transition-base);
    }
    .mobile-drawer.open .mobile-drawer-content {
      transform: translateX(0);
    }
    .mobile-drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 1.2rem;
    }
    .btn-close-drawer {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--color-dark);
      padding: 4px;
    }
    .mobile-nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .mobile-nav-links a {
      text-decoration: none;
      color: var(--color-dark);
      font-size: 1.05rem;
      font-weight: 600;
      display: block;
      padding: 0.4rem 0;
    }
    .mobile-drawer-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    /* ======================================================== */
    /* AÇILIŞ ALANI (HERO SECTION)                              */
    /* ======================================================== */
    .hero {
      position: relative;
      background: linear-gradient(180deg, rgba(30, 30, 26, 0.48) 0%, rgba(30, 30, 26, 0.58) 100%),
                  url('https://cf.bstatic.com/xdata/images/hotel/max1024x768/911185635.jpg?k=7a6598d6a1c18a281df199298f4e4dc060bf32afc7f48e5e13e9662813087180&o=') center/cover no-repeat;
      color: #fff;
      padding: 6.5rem 1.5rem 5.5rem;
      text-align: center;
    }
    .hero-content {
      max-width: 820px;
      margin: 0 auto;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(168, 134, 75, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(8px);
      padding: 0.35rem 1.1rem;
      border-radius: var(--radius-pill);
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1.4rem;
      font-weight: 600;
      color: #F8F5EE;
    }
    .hero h1 {
      font-family: var(--font-serif);
      font-size: 2.85rem;
      line-height: 1.22;
      margin-bottom: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .hero p {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 2rem;
      font-weight: 300;
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.65;
    }

    /* 3 Doğrulanmış Avantaj */
    .hero-advantages {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .advantage-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.84rem;
      background: rgba(30, 30, 26, 0.45);
      backdrop-filter: blur(6px);
      padding: 0.35rem 0.85rem;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.95);
    }
    .advantage-pill .icon {
      color: var(--color-gold);
    }

    /* ======================================================== */
    /* REZERVASYON AKIŞI & TARİH SEÇİM ÇUBUĞU                   */
    /* ======================================================== */
    .booking-bar-wrapper {
      max-width: 1040px;
      margin: -2.8rem auto 4.5rem;
      padding: 0 1.5rem;
      position: relative;
      z-index: 10;
    }
    .booking-card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 1.4rem 1.8rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
    }
    .booking-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr))
